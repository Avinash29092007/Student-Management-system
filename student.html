<!DOCTYPE html>
<html>
<head>
    <title>Students</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Student List</h1>

<table>

<tr>
    <th>Name</th>
    <th>Department</th>
    <th>Year</th>
</tr>

{% for student in students %}

<tr>
    <td>{{ student.name }}</td>
    <td>{{ student.department }}</td>
    <td>{{ student.year }}</td>
</tr>

{% endfor %}

</table>

<br>

<a href="/">Add Another Student</a>

</body>
</html>
